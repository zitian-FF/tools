<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wiki14</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <main>
    <h1>wiki14</h1>
    <p class="subtitle">Paste the styled EN sourcecode, attach the translation sheet, get 13 ready-to-paste versions.</p>

    <section class="field">
      <label for="en-sourcecode">EN sourcecode</label>
      <textarea id="en-sourcecode" rows="10" placeholder="&lt;p&gt;&lt;strong&gt;...&lt;/strong&gt;&lt;/p&gt;"></textarea>
    </section>

    <section class="field">
      <label for="excel-file">Translation sheet (.xlsx / .xls / .csv)</label>
      <input type="file" id="excel-file" accept=".xlsx,.xls,.csv" />
      <div id="sheet-picker" class="hidden">
        <label for="sheet-select">Sheet</label>
        <select id="sheet-select"></select>
      </div>
    </section>

    <button id="run-button">Generate 13 languages</button>

    <div id="status" class="status hidden"></div>
    <div id="flags" class="flags hidden"></div>

    <section id="results" class="results hidden">
      <h2>Results</h2>
      <div id="result-tabs" class="tabs"></div>
      <div id="result-panels"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
